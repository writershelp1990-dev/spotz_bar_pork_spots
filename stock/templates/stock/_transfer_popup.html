<div id="transfer-popup-container" aria-live="polite"></div>
<script>
(function () {
  const container = document.getElementById("transfer-popup-container");
  if (!container) return;
  const seen = new Set();

  function getCSRFToken() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : "";
  }

  function renderAction(a) {
    if (seen.has(a.id)) return;
    seen.add(a.id);

    const el = document.createElement("div");
    el.className = "transfer-popup";
    el.setAttribute("role", "alertdialog");

    let inner = '<div class="transfer-popup__title">' + a.title + '</div>' +
      '<div class="transfer-popup__body">' +
      '<div class="muted">' + a.from_area + ' → ' + a.to_area + '</div>';

    if (a.kind === 'sender_accept') {
      inner += '<div>Requested: <strong>' + a.quantity_requested + ' ' + a.unit + '</strong></div>' +
        '<div class="muted small">by ' + a.requested_by + '</div>' +
        '<form method="post" action="' + a.accept_url + '" style="margin-top:8px">' +
        '<input type="hidden" name="csrfmiddlewaretoken" value="' + getCSRFToken() + '">' +
        '<label>Quantity sent: <input type="number" step="0.001" name="quantity_sent" value="' + a.quantity_requested + '" required></label>' +
        '<button type="submit">Accept &amp; send</button></form>' +
        '<form method="post" action="' + a.reject_url + '" style="margin-top:6px">' +
        '<input type="hidden" name="csrfmiddlewaretoken" value="' + getCSRFToken() + '">' +
        '<input type="text" name="reason" placeholder="Reject reason" required>' +
        '<button type="submit">Reject</button></form>';
    } else if (a.kind === 'recipient_acknowledge') {
      inner += '<div>Sent: <strong>' + a.quantity_sent + ' ' + a.unit + '</strong></div>' +
        '<div class="muted small">by ' + a.sent_by + '</div>' +
        '<form method="post" action="' + a.accept_url + '" style="margin-top:8px">' +
        '<input type="hidden" name="csrfmiddlewaretoken" value="' + getCSRFToken() + '">' +
        '<label>Quantity received: <input type="number" step="0.001" name="quantity_received" value="' + a.quantity_sent + '" required></label>' +
        '<label style="display:block;margin-top:4px">Variance reason (if any): <input type="text" name="variance_reason"></label>' +
        '<button type="submit" style="margin-top:6px">Acknowledge receipt</button></form>' +
        '<form method="post" action="' + a.reject_url + '" style="margin-top:6px">' +
        '<input type="hidden" name="csrfmiddlewaretoken" value="' + getCSRFToken() + '">' +
        '<input type="text" name="reason" placeholder="Reject reason" required>' +
        '<button type="submit">Reject</button></form>';
    }
    inner += '<div class="muted small" style="margin-top:6px">' +
      '<a href="' + a.url + '">Open full view</a></div>' +
      '</div>' +
      '<button class="transfer-popup__close">Dismiss</button>';

    el.innerHTML = inner;
    el.querySelector('.transfer-popup__close').addEventListener('click', () => {
      el.remove();
    });
    container.appendChild(el);
  }

  async function poll() {
    try {
      const res = await fetch("/stock/api/pending-transfers/", {
        credentials: "same-origin",
        headers: { "X-Requested-With": "XMLHttpRequest" },
      });
      if (res.ok) {
        const data = await res.json();
        for (const a of data.actions) renderAction(a);
      }
    } catch (e) {}
  }

  poll();
  setInterval(poll, 60000);
})();
</script>

<style>
.transfer-popup { position: fixed; right: 16px; bottom: 16px; z-index: 9999;
  max-width: 420px; background: #eff6ff; border: 2px solid #2563eb;
  border-radius: 8px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.transfer-popup__title { color: #1e40af; font-weight: 700; margin-bottom: 6px; }
.transfer-popup__close { margin-top: 10px; padding: 6px 12px; border: 0; border-radius: 6px;
  background: #6b7280; color: white; cursor: pointer; font-weight: 600; }
.transfer-popup button { padding: 6px 12px; border: 0; border-radius: 6px;
  background: #2563eb; color: white; cursor: pointer; font-weight: 600; }
.transfer-popup input { padding: 4px 6px; }
.transfer-popup .muted { color: #6b7280; }
.transfer-popup .small { font-size: .85em; }
</style>
