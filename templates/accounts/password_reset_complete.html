{% extends "base.html" %}

{% block content %}
<div class="password-reset-page password-reset-centered">
    <section class="password-reset-card password-reset-success-card">
        <div class="password-reset-success-icon">✓</div>

        <div class="password-reset-kicker">
            <span></span>
            SECURITY UPDATED
        </div>

        <h1>Password changed</h1>

        <p>
            Your SPOTZ account password has been changed successfully.
        </p>

        <p class="password-reset-muted">
            Your reset link can no longer be used.
        </p>

        <a href="{% url 'login' %}" class="password-reset-submit">
            Sign In
        </a>
    </section>
</div>
{% endblock %}
