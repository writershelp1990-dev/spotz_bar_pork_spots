{% extends "base.html" %}

{% block content %}
<div class="password-reset-page password-reset-centered">
    <section class="password-reset-card password-reset-success-card">
        <div class="password-reset-success-icon">✉</div>

        <div class="password-reset-kicker">
            <span></span>
            CHECK YOUR EMAIL
        </div>

        <h1>Reset instructions sent</h1>

        <p>
            If an account exists for that email address, password-reset
            instructions have been sent.
        </p>

        <p class="password-reset-muted">
            Check your inbox and follow the secure link to create a new password.
        </p>

        <a href="{% url 'login' %}" class="password-reset-submit">
            Return to Login
        </a>
    </section>
</div>
{% endblock %}
