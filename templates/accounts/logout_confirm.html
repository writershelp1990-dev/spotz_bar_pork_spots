{% extends "base.html" %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Sign Out</h1>
        <p>Are you sure you want to sign out?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-primary">Logout</button>
        </form>
    </div>
</div>
{% endblock %}
